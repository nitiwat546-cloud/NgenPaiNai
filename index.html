<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>เงินไปไหน</title>
  <meta name="description" content="จดรายรับรายจ่ายประจำวันแบบง่ายๆ รู้ว่าเดือนนี้ใช้ได้อีกเท่าไร">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23d4ff2a'/><path d='M9 23 16 9l7 14' stroke='%230f0f0f' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-food" viewBox="0 0 24 24"><path d="M4 12h16a8 8 0 0 1-16 0Z"/><path d="m14 3-3.5 8M19 4l-6 7"/></symbol>
      <symbol id="i-drink" viewBox="0 0 24 24"><path d="M6.5 8h11l-1.4 12.2a1 1 0 0 1-1 .8H8.9a1 1 0 0 1-1-.8Z"/><path d="m12 8 1.6-5H17M7 13h10"/></symbol>
      <symbol id="i-transport" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="14" rx="2.5"/><path d="M5 10h14M8.5 17v3M15.5 17v3M8.5 13.5h.01M15.5 13.5h.01"/></symbol>
      <symbol id="i-shopping" viewBox="0 0 24 24"><path d="M5 8h14l-1 12.1a1 1 0 0 1-1 .9H7a1 1 0 0 1-1-.9Z"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10"/></symbol>
      <symbol id="i-bills" viewBox="0 0 24 24"><path d="M13.5 2.5 5 13.5h6.5l-1 8 8.5-11h-6.5Z"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 11 12 3.5l8.5 7.5"/><path d="M5.5 9.5V20h13V9.5M10 20v-5.5h4V20"/></symbol>
      <symbol id="i-health" viewBox="0 0 24 24"><path d="M9 3.5h6v5.5h5.5v6H15v5.5H9V15H3.5V9H9Z"/></symbol>
      <symbol id="i-fun" viewBox="0 0 24 24"><path d="M3.5 7h17v3.2a2 2 0 0 0 0 3.6V17h-17v-3.2a2 2 0 0 0 0-3.6Z"/><path d="M14 7v10" stroke-dasharray="2 2.2"/></symbol>
      <symbol id="i-merit" viewBox="0 0 24 24"><path d="M12 2.8c2.3 3 3.3 4.7 3.3 6.6a3.3 3.3 0 0 1-6.6 0c0-1.9 1-3.6 3.3-6.6Z"/><path d="M9.5 15.5h5V21h-5ZM6 21h12"/></symbol>
      <symbol id="i-other" viewBox="0 0 24 24"><path d="m4 7.5 8-4 8 4v9l-8 4-8-4Z"/><path d="m4 7.5 8 4 8-4M12 11.5v9"/></symbol>
      <symbol id="i-salary" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4.5h6V7M3 12.5h18M12 11v3"/></symbol>
      <symbol id="i-side" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v10M9.3 9.5h3.9a1.6 1.6 0 0 1 0 3.2H10m0 0h3.6a1.6 1.6 0 0 1 0 3.2H9.3"/></symbol>
      <symbol id="i-gift" viewBox="0 0 24 24"><path d="M4.5 11h15v9.5h-15ZM3 7.5h18V11H3ZM12 7.5v13"/><path d="M12 7.5S9.5 3 7.8 4.6 9 7.5 12 7.5Zm0 0s2.5-4.5 4.2-2.9S15 7.5 12 7.5Z"/></symbol>
      <symbol id="i-refund" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"/><path d="M4 3.5V8h4.5"/></symbol>
      <symbol id="i-other-in" viewBox="0 0 24 24"><path d="M12 3.5v5M12 15.5v5M3.5 12h5M15.5 12h5M6.3 6.3l2.4 2.4M15.3 15.3l2.4 2.4M6.3 17.7l2.4-2.4M15.3 8.7l2.4-2.4"/></symbol>
      <symbol id="i-unknown" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.8 9.6a2.3 2.3 0 1 1 3.2 2.1c-.6.3-1 .8-1 1.5v.4M12 16.6h.01"/></symbol>
      <symbol id="i-dots" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="i-sheet" viewBox="0 0 24 24"><path d="M5 3.5h10l4 4v13H5Z"/><path d="M9 12h6M9 16h6"/></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 3.5v11M7.5 10l4.5 4.5 4.5-4.5M4.5 19.5h15"/></symbol>
      <symbol id="i-restore" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M4.5 19.5h15"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 6.5h15M9.5 6.5V4h5v2.5M6.5 6.5l1 14h9l1-14"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <header class="bar">
      <h1 class="logo">เงินไปไหน</h1>
      <button class="icon-btn" id="menuBtn" aria-label="งบและข้อมูล"><svg class="ic"><use href="#i-dots"/></svg></button>
    </header>

    <nav class="months" aria-label="เลือกเดือน">
      <button class="icon-btn" id="prevMonth" aria-label="เดือนก่อน"><svg class="ic"><use href="#i-left"/></svg></button>
      <button class="month-pill" id="monthLabel" title="กลับไปเดือนนี้"></button>
      <button class="icon-btn" id="nextMonth" aria-label="เดือนถัดไป"><svg class="ic"><use href="#i-right"/></svg></button>
    </nav>

    <section class="answer" id="answer" aria-live="polite"></section>
    <p class="flow" id="flow"></p>

    <div class="tabs" role="tablist" aria-label="มุมมอง">
      <button class="tab" role="tab" data-view="list">รายการ</button>
      <button class="tab" role="tab" data-view="stats">เงินไปไหน</button>
    </div>

    <main id="view"></main>
  </div>

  <button class="fab" id="addBtn"><svg class="ic"><use href="#i-plus"/></svg>จด</button>

  <!-- จด / แก้ไขรายการ -->
  <dialog id="txDialog" class="sheet" aria-labelledby="txTitle">
    <form id="txForm" novalidate>
      <div class="sheet-head">
        <h2 id="txTitle">จดรายการ</h2>
        <button type="button" class="icon-btn" id="closeTx" aria-label="ปิด"><svg class="ic"><use href="#i-close"/></svg></button>
      </div>

      <div class="seg" id="typeSeg" role="group" aria-label="ประเภท">
        <button type="button" data-type="expense">รายจ่าย</button>
        <button type="button" data-type="income">รายรับ</button>
      </div>

      <label class="amount">
        <span class="baht">฿</span>
        <input id="amount" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="จำนวนเงิน (พิมพ์ 60+45 ได้)">
      </label>

      <div class="cats" id="catGrid" role="group" aria-label="หมวด"></div>

      <div class="fields">
        <label class="field">
          <span>จดไว้กันลืม</span>
          <input id="note" maxlength="80" placeholder="เช่น ข้าวมันไก่" autocomplete="off">
        </label>
        <div class="field">
          <span id="dateLbl">วันที่ · <b id="dateShow"></b></span>
          <div class="date-row" role="group" aria-labelledby="dateLbl">
            <button type="button" class="dchip" data-day="today">วันนี้</button>
            <button type="button" class="dchip" data-day="yesterday">เมื่อวาน</button>
            <span class="dchip-wrap">
              <button type="button" class="dchip" data-day="pick">เลือกวัน</button>
              <input type="date" id="date" tabindex="-1" aria-label="เลือกวันที่">
            </span>
          </div>
        </div>
      </div>

      <p class="form-msg" id="formMsg" hidden></p>

      <div class="sheet-foot">
        <button type="button" class="btn danger" id="deleteBtn" hidden><svg class="ic"><use href="#i-trash"/></svg>ลบ</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="doneBtn">เสร็จ</button>
        <button type="submit" class="btn primary" id="saveBtn">บันทึก</button>
      </div>
    </form>
  </dialog>

  <!-- งบ + ข้อมูล -->
  <dialog id="menuDialog" class="sheet" aria-labelledby="menuTitle">
    <div class="menu">
      <div class="sheet-head">
        <h2 id="menuTitle">งบต่อเดือน</h2>
        <button type="button" class="icon-btn" id="menuClose" aria-label="ปิด"><svg class="ic"><use href="#i-close"/></svg></button>
      </div>
      <form class="budget-form" id="budgetForm" novalidate>
        <label class="amount amount-sm">
          <span class="baht">฿</span>
          <input id="budgetInput" inputmode="decimal" autocomplete="off" placeholder="เช่น 15000" aria-label="งบใช้จ่ายต่อเดือน">
        </label>
        <button type="submit" class="btn primary">ตั้งงบ</button>
      </form>
      <p class="menu-note" id="budgetNote">แอปจะบอกว่าเดือนนี้ใช้ได้อีกเท่าไร และใช้ได้วันละเท่าไรจนถึงสิ้นเดือน ถ้าเว้นว่างไว้จะเป็นการยกเลิกงบ</p>

      <h3 class="menu-h" id="fixedHead">รายจ่ายประจำทุกเดือน</h3>
      <p class="menu-note">เช่น ค่าห้องรวมน้ำไฟ ค่าเน็ต ค่ามือถือ แอปจะหักออกจากงบให้ทุกเดือน ไม่ต้องจดเอง</p>
      <ul class="fixed-list" id="fixedList"></ul>
      <form class="fixed-form" id="fixedForm" novalidate>
        <div class="fixed-grid">
          <label class="field">
            <span>ชื่อรายการ</span>
            <input id="fixedName" maxlength="40" placeholder="เช่น ค่าห้อง+น้ำไฟ" autocomplete="off">
          </label>
          <label class="field">
            <span>บาทต่อเดือน</span>
            <input id="fixedAmount" inputmode="decimal" placeholder="เช่น 3,500" autocomplete="off">
          </label>
          <label class="field">
            <span>หมวด</span>
            <select id="fixedCat"></select>
          </label>
        </div>
        <p class="form-msg" id="fixedMsg" hidden></p>
        <div class="sheet-foot">
          <button type="button" class="btn ghost" id="fixedCancel" hidden>ยกเลิกแก้ไข</button>
          <span class="spacer"></span>
          <button type="submit" class="btn primary" id="fixedSave">เพิ่มรายจ่ายประจำ</button>
        </div>
      </form>

      <h3 class="menu-h">ข้อมูลของคุณ</h3>
      <p class="menu-note" id="menuNote"></p>
      <button class="menu-item" id="exportCsv"><svg class="ic"><use href="#i-sheet"/></svg>ส่งออกเป็น CSV เปิดใน Excel ได้</button>
      <button class="menu-item" id="backupJson"><svg class="ic"><use href="#i-save"/></svg>สำรองข้อมูลเป็นไฟล์</button>
      <button class="menu-item" id="restoreJson"><svg class="ic"><use href="#i-restore"/></svg>กู้คืนจากไฟล์สำรอง</button>
      <button class="menu-item danger" id="clearAll"><svg class="ic"><use href="#i-trash"/></svg>ลบข้อมูลทั้งหมด</button>
    </div>
  </dialog>

  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
